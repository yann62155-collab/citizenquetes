name: Build Citizen Quêtes
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Télécharger Citizen Economy (pour les virements)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs
          gh release download --repo yann62155-collab/citizeneconomy --pattern '*.jar' --dir libs
          ls -l libs
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: citizenquetes
          path: build/libs/citizenquetes-*.jar
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Citizen Quêtes v1.0.${{ github.run_number }}
          files: build/libs/citizenquetes-*.jar
